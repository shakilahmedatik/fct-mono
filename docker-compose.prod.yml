version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: firstcup-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-first_cup_tech}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - prod_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d first_cup_tech"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: firstcup-prod-valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes --protected-mode no
    ports:
      - "6379:6379"
    volumes:
      - prod_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rustfs:
    image: minio/minio:latest
    container_name: firstcup-prod-rustfs
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-rustfsadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-rustfspassword}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - prod_rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: firstcup-prod-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/first_cup_tech
      REDIS_URL: redis://valkey:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: firstcup-prod-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/first_cup_tech
      REDIS_URL: redis://valkey:6379
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-rustfspassword}
      S3_BUCKET_NAME: ${STORAGE_BUCKET:-first-cup-tech-audio}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy

volumes:
  prod_pg_data:
  prod_valkey_data:
  prod_rustfs_data:
