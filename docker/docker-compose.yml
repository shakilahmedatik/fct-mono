# Local development stack.
#
# Image versions are kept in step with docker-compose.prod.yml so a change
# cannot work locally and fail in production (the previous version used
# pgvector pg17 here and pg16 in production, valkey 7 here and 8 in
# production, and rustfs here and minio in production).

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: firstcup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: first_cup_tech
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d first_cup_tech"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Valkey (Redis-compatible) ────────────────────────────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: firstcup-valkey
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── RustFS (S3-compatible object storage) ────────────────────────────────────
  rustfs:
    image: rustfs/rustfs:latest
    container_name: firstcup-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: rustfspassword
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # Web console
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── RustFS bucket initializer (runs once, then exits) ───────────────────────
  rustfs-init:
    image: rustfs/mc:latest
    container_name: firstcup-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://rustfs:9000 rustfsadmin rustfspassword &&
        mc mb --ignore-existing local/first-cup-tech-audio &&
        echo 'Bucket first-cup-tech-audio is ready.'
      "

volumes:
  postgres_data:
  valkey_data:
  rustfs_data:
